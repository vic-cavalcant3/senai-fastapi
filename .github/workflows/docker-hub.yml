
  Deploy:
    name: Implantação AWS
    runs-on: ubuntu-latest
    needs: Imagem
    if: github.event_name == 'push'
    steps:
      - name: Deploy via SSH na EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull viccavalcante/senai_fastapi:latest

            sudo docker stop senai_fastapi 2>/dev/null || true
            sudo docker rm senai_fastapi 2>/dev/null || true

            sudo docker run -d \
              --name senai_fastapi \
              --restart unless-stopped \
              -p 8080:8080 \
              viccavalcante/senai_fastapi:latest

            sleep 5
            curl -f http://localhost:8080/health || exit 1
            echo "Deploy concluído com sucesso!"
            sudo docker image prune -f