name: Pipeline CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  IMAGE_NAME: viccavalcante/senai_fastapi
  CONTAINER_NAME: senai_fastapi
  APP_PORT: "8080"

jobs:
  Build:
    name: Compilar Projeto
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest httpx

      - name: Executar testes com pytest
        run: PYTHONPATH=. pytest tests/ -v --tb=short

  Imagem:
    name: Construindo Imagem para Docker
    runs-on: ubuntu-latest
    needs: Build
    if: github.event_name == 'push'
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref == 'refs/heads/main' && 'latest' || 'develop' }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  Deploy_Homologacao:
    name: Deploy Homologação
    runs-on: ubuntu-latest
    needs: Imagem
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: homologacao
    steps:
      - name: Deploy via SSH na EC2 de homologação
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_NAME,CONTAINER_NAME,APP_PORT,IMAGE_TAG
          script: |
            sudo docker pull $IMAGE_NAME:$IMAGE_TAG

            sudo docker stop $CONTAINER_NAME 2>/dev/null || true
            sudo docker rm $CONTAINER_NAME 2>/dev/null || true

            sudo docker run -d \
              --name $CONTAINER_NAME \
              --restart unless-stopped \
              -p $APP_PORT:8080 \
              $IMAGE_NAME:$IMAGE_TAG

            sleep 5
            curl -f http://localhost:$APP_PORT/health || exit 1
            echo "Deploy HOMOL concluído com sucesso!"
            sudo docker image prune -f

  Deploy_Producao:
    name: Deploy Produção
    runs-on: ubuntu-latest
    needs: Imagem
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: producao
    steps:
      - name: Deploy via SSH na EC2 de produção
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_NAME,CONTAINER_NAME,APP_PORT,IMAGE_TAG
          script: |
            sudo docker pull $IMAGE_NAME:$IMAGE_TAG

            sudo docker stop $CONTAINER_NAME 2>/dev/null || true
            sudo docker rm $CONTAINER_NAME 2>/dev/null || true

            sudo docker run -d \
              --name $CONTAINER_NAME \
              --restart unless-stopped \
              -p $APP_PORT:8080 \
              $IMAGE_NAME:$IMAGE_TAG

            sleep 5
            curl -f http://localhost:$APP_PORT/health || exit 1
            echo "Deploy PRD concluído com sucesso!"
            sudo docker image prune -f
